# Recording rules: precompute expressions that alerts and dashboards reuse,
# so the expensive aggregations run once per evaluation instead of on every
# dashboard refresh. Naming follows level:metric:operations.
groups:
  - name: host.recording
    rules:
      - record: instance:node_cpu_utilisation:rate5m
        expr: 1 - avg by (job, instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
      - record: instance:node_memory_utilisation:ratio
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
      - record: instance_mountpoint:node_filesystem_avail_bytes:ratio
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/boot.*"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|nsfs|fuse.*",mountpoint!~"/boot.*"}

  - name: http.recording
    rules:
      - record: job_instance:http_requests:rate5m
        expr: sum by (job, instance) (rate(http_requests_total[5m]))
      - record: job_instance:http_requests_errors:rate5m
        expr: sum by (job, instance) (rate(http_requests_total{status=~"5.."}[5m]))
      - record: job_instance:http_requests_errors:ratio_rate5m
        expr: job_instance:http_requests_errors:rate5m / job_instance:http_requests:rate5m
      - record: job_instance:http_request_duration_seconds:p95_rate5m
        expr: histogram_quantile(0.95, sum by (job, instance, le) (rate(http_request_duration_seconds_bucket[5m])))
