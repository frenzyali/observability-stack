# SLO for the sample app: 99.5% of requests succeed (non-5xx) over a
# rolling 7-day window. Error budget = 0.5% of requests.
# Error ratio is recorded per window for the multi-window, multi-burn-rate
# alerts in slo.yml and for the error-budget panels in Grafana.
# The "or ... * 0" branch keeps the series at 0 when no 5xx has been seen.
groups:
  - name: slo.sample-app.recording
    rules:
      - record: slo:objective:ratio
        expr: vector(0.995)
        labels:
          job: sample-app
      - record: job:slo_errors_per_request:ratio_rate5m
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[5m]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[5m])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[5m]))
      - record: job:slo_errors_per_request:ratio_rate30m
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[30m]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[30m])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[30m]))
      - record: job:slo_errors_per_request:ratio_rate1h
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[1h]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[1h])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[1h]))
      - record: job:slo_errors_per_request:ratio_rate2h
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[2h]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[2h])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[2h]))
      - record: job:slo_errors_per_request:ratio_rate6h
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[6h]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[6h])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[6h]))
      - record: job:slo_errors_per_request:ratio_rate1d
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[1d]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[1d])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[1d]))
      - record: job:slo_errors_per_request:ratio_rate3d
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[3d]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[3d])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[3d]))
      - record: job:slo_errors_per_request:ratio_rate7d
        expr: |
          (sum by (job) (rate(http_requests_total{job="sample-app",status=~"5.."}[7d]))
            or sum by (job) (rate(http_requests_total{job="sample-app"}[7d])) * 0)
          / sum by (job) (rate(http_requests_total{job="sample-app"}[7d]))
