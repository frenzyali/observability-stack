# Prometheus configuration. Mounted read-only into the container.
# Retention (15d) is set on the command line in compose.yaml.
# No remote_write block: samples stay on this node (see README, Roadmap).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Cardinality control 1: keep Docker containers only (systemd driver
      # "/system.slice/docker-<id>.scope" or cgroupfs driver "/docker/<id>"),
      # dropping the per-systemd-service series cAdvisor also exports.
      - source_labels: [id]
        regex: "/system.slice/docker-[0-9a-f]+\\.scope|/docker/[0-9a-f]+"
        action: keep
      # Short 12-character container ID, as shown by `docker ps`.
      - source_labels: [id]
        regex: ".*docker[-/]([0-9a-f]{12}).*"
        target_label: container_id
      # Cardinality control 2: drop series no dashboard or alert uses.
      - source_labels: [__name__]
        regex: "container_(tasks_state|memory_failures_total|fs_inodes_.*|cpu_load_.*|blkio_device_usage_total)"
        action: drop
      - source_labels: [__name__]
        regex: "container_network_.*_(errors|dropped)_total"
        action: drop

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  - job_name: sample-app
    static_configs:
      - targets: ["sample-app:8000"]

  # Black-box HTTP probes. Each target is probed by blackbox-exporter; the
  # target URL becomes the "instance" label.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://sample-app:8000/healthz
          - http://grafana:3000/api/health
          - http://prometheus:9090/-/healthy
          - http://alertmanager:9093/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
